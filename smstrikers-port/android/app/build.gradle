plugins {
    id 'com.android.application'
}

// Set by tools/build-android.sh, overridable in gradle.properties.
def nativeBuildDir = providers.gradleProperty('strikers.nativeBuildDir').get()
def sdlJavaDir = providers.gradleProperty('strikers.sdlJavaDir').get()
def auroraJavaDir = providers.gradleProperty('strikers.auroraJavaDir').get()

android {
    namespace 'io.github.newcoke.strikers'
    compileSdk 35
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'io.github.newcoke.strikers'
        // 28, because that is what Aurora's prebuilt Dawn is compiled against; the game itself
        // asks for nothing newer.
        minSdk 28
        targetSdk 35
        // strikers-quest: the Quest alpha's own numbers (the phone port was 1 / 1.2.0). Raise
        // versionCode with every public build so an update installs over the last one.
        versionCode 6969
        versionName '0.1.18-dev (r193)'
        ndk {
            // The only ABI the prebuilt Dawn package exists for, and the only one worth shipping:
            // a 32-bit build would not address the game's heap comfortably, and x86 Android is
            // emulators.
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            // SDL's Java has to be the Java of the SDL this was linked against, so it comes out of
            // the native build directory rather than being vendored here and going stale.
            java.srcDirs += [sdlJavaDir, auroraJavaDir]
            jniLibs.srcDirs = ["${nativeBuildDir}/jniLibs"]
            // Staged rather than pointed at ../../assets directly: that directory also holds the
            // Windows icon resources and the Linux and macOS packaging bits, and an APK should
            // carry only what the game reads at runtime.
            assets.srcDirs += ["${layout.buildDirectory.get().asFile}/strikers-assets"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // The game is all native code; there is no Java worth shrinking, and R8 would only put
            // SDLActivity's reflected entry points at risk.
            signingConfig signingConfigs.debug
        }
        debug {
            // No applicationIdSuffix on purpose. The suffix would move the app's own folder on
            // shared storage, and that folder is where the player put a 1.4 GB disc image: a debug
            // build that cannot see it is not a debug build of the same game.
        }
    }

    packaging {
        jniLibs {
            // TRUE, e nao o padrao. Mapear os .so direto do APK e melhor -- poupa desempacotar
            // dezenas de MB na instalacao -- mas o libadrenotools, que e como um driver Turnip
            // escolhido pelo jogador entra, instala o gancho dele em nativeLibraryDir, e essa
            // pasta so existe de verdade quando as bibliotecas sao extraidas. Sem isto o
            // carregamento do driver devolve um ponteiro valido e depois nao enumera nenhuma GPU.
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        // The disc image is data, not a resource, but the input prompt artwork under assets/ must
        // not be compressed either: SDL reads it through the asset manager and a compressed asset
        // cannot be mapped.
        // strikers-quest r147: 'ogg' too, so MediaPlayer plays the menu music straight out of the APK (openFd)
        noCompress += ['png', 'txt', 'jpg', 'ogg']
    }
}

// The button prompt artwork, the one thing under assets/ the game reads at runtime. It is staged
// into the build directory so the APK does not also carry the icons and the desktop packaging.
def stageAssets = tasks.register('stageStrikersAssets', Sync) {
    from('../../assets/input-prompts') {
        into 'input-prompts'
    }
    // strikers-quest r61: the cup suites' baked rooms, one per home captain (tools/suites in the
    // workspace bakes them).
    from('../../assets/suites') {
        into 'suites'
    }
    // strikers-quest 1.14: our own franchise data and art (clubs, ratings, evolution levels; club / playoff /
    // league logos), staged into STRIKERS_HOME by StrikersHome; the guests themselves are made on the headset.
    from('../../assets/franchise') {
        into 'franchise'
    }
    from('../../assets/guestart') {
        into 'guestart'
    }
    // strikers-quest r183: the ORIGINALS (our own characters: packs, portraits, roster rows; tools/outside/originals183.py),
    // staged into STRIKERS_HOME/guests by StrikersHome - in every build, Lance's and the public one
    from('../../assets/originals') {
        into 'originals'
    }
    // strikers-quest r147: the menu music (CC0 lofi playlist + franchise theme, credits), played from the APK
    // by MenuMusic.java; not copied out to STRIKERS_HOME
    from('../../assets/music') {
        into 'music'
    }
    into layout.buildDirectory.dir('strikers-assets')
}

// QUEM LÃƒÅ  A PASTA DEPENDE DE QUEM A ESCREVE, e nÃƒÂ£o sÃƒÂ³ quem a empacota.
//
// Era sÃƒÂ³ merge*Assets, e isso bastava para o debug. O release trouxe o lint
// "vital", que monta um modelo do projeto e, para isso, percorre os diretÃƒÂ³rios
// de assets -- sem passar pelo merge. O Gradle vÃƒÂª uma tarefa lendo a saÃƒÂ­da de
// outra sem dependÃƒÂªncia declarada e recusa a build, com razÃƒÂ£o: a ordem entre as
// duas nÃƒÂ£o estaria garantida.
//
// A lista ÃƒÂ© por nome porque o diretÃƒÂ³rio entra na source set como texto, e um
// caminho em texto nÃƒÂ£o carrega consigo quem o produziu. Se aparecer mais uma
// tarefa que leia assets, ÃƒÂ© aqui que ela entra.
tasks.configureEach { task ->
    final boolean empacota = task.name.startsWith('merge') && task.name.endsWith('Assets')
    final boolean analisa = task.name.toLowerCase().contains('lint')
    if (empacota || analisa) {
        task.dependsOn stageAssets
    }
}

// A build that packages stale shared objects is worse than one that fails: the APK installs, runs,
// and is a version nobody can account for.
tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('JniLibFolders')) {
        task.doFirst {
            def lib = file("${nativeBuildDir}/jniLibs/arm64-v8a/libmain.so")
            if (!lib.exists()) {
                throw new GradleException(
                    "No native build at ${lib}.\n" +
                    "Run tools/build-android.sh first; it configures, builds and stages the " +
                    "shared objects this project packages.")
            }
        }
    }
}
