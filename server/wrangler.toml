name = "strikers-rooms"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "QUEUES"
class_name = "Matchmaker"

[[durable_objects.bindings]]
name = "TOURNEYS"
class_name = "Tourneys"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Matchmaker"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Tourneys"]

# r100: online franchise leagues (2-8 headsets)
[[durable_objects.bindings]]
name = "LEAGUES"
class_name = "League"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["League"]

# No [vars]: TEST_FAST (short tournament timers for test-tourney.mjs) is only ever given to a local
# `wrangler dev --var TEST_FAST:1`, never to the deployed worker.
